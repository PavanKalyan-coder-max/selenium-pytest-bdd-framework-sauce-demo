[pytest]

addopts =
    -v
    -s
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results

testpaths = step_definitions

python_files = test_*.py

markers =
    smoke: Smoke suite
    regression: Regression suite
    sanity: Sanity suite
    checkout: Checkout tests
    login: Login tests